name: MediConnect CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x

    - name: Install & Build Backend
      run: |
        cd backend
        npm ci
        
    - name: Install & Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
